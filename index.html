<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHK Account Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyvwCnhfr2_IIz5m8_OWwskqrcJrFmyqE",
            authDomain: "usa-001-a4193.firebaseapp.com",
            projectId: "usa-001-a4193",
            storageBucket: "usa-001-a4193.firebasestorage.app",
            messagingSenderId: "569974903486",
            appId: "1:569974903486:web:dc272b7aaa123f697d84ef",
            measurementId: "G-L9QQPEN3QN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const WORKER_URL = "https://pawangrecoil-server.mbahbabat.workers.dev";

        // Elemen DOM
        const loginSection = document.getElementById("login-section");
        const setPasswordSection = document.getElementById("set-password-section");
        const dashboardSection = document.getElementById("dashboard-section");
        const userEmailSpan = document.getElementById("user-email");
        const hwidSpan = document.getElementById("hwid");
        const resetHwidBtn = document.getElementById("reset-hwid-btn");
        const changePasswordBtn = document.getElementById("change-password-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const messageDiv = document.getElementById("message");

        function showMessage(msg, isError = true) {
            messageDiv.textContent = msg;
            messageDiv.className = `text-center p-2 rounded ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            setTimeout(() => { messageDiv.textContent = ''; messageDiv.className = ''; }, 4000);
        }

        async function callAPI(endpoint, method, body = null, token) {
            const res = await fetch(`${WORKER_URL}${endpoint}`, {
                method: method,
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: body ? JSON.stringify(body) : undefined
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Request gagal");
            return data;
        }

        async function loadProfile(token) {
            const profile = await callAPI("/profile", "GET", null, token);
			document.getElementById("display-username").innerText = profile.username;
            if (!profile.hasPassword) {
                // Belum punya password, tampilkan form set password
                setPasswordSection.classList.remove("hidden");
                dashboardSection.classList.add("hidden");
                loginSection.classList.add("hidden");
                userEmailSpan.textContent = profile.email;
            } else {
                // Tampilkan dashboard
                setPasswordSection.classList.add("hidden");
                dashboardSection.classList.remove("hidden");
                loginSection.classList.add("hidden");
                userEmailSpan.textContent = profile.email;
                hwidSpan.textContent = profile.hwid ? `🔒 ${profile.hwid}` : "❌ Belum ada HWID (belum pernah login dari AHK)";
            }
        }

        // Event: Set / Ganti Password
        async function setPassword(token, newPassword) {
            await callAPI("/set-password", "POST", { newPassword }, token);
            showMessage("Password berhasil disimpan!", false);
            await loadProfile(token); // refresh ke dashboard
        }

        // Event: Reset HWID
        async function resetHwid(token) {
            await callAPI("/reset-hwid", "POST", null, token);
            showMessage("HWID berhasil direset. Silakan login dari PC baru.", false);
            await loadProfile(token);
        }

        // Handle form set password
        document.getElementById("save-password-btn").addEventListener("click", async () => {
            const token = await auth.currentUser?.getIdToken();
            if (!token) return;
            const newPass = document.getElementById("new-password").value;
            const confirmPass = document.getElementById("confirm-password").value;
            if (newPass.length < 4) {
                showMessage("Password minimal 4 karakter");
                return;
            }
            if (newPass !== confirmPass) {
                showMessage("Konfirmasi password tidak cocok");
                return;
            }
            try {
                await setPassword(token, newPass);
                document.getElementById("new-password").value = "";
                document.getElementById("confirm-password").value = "";
            } catch (err) {
                showMessage(err.message);
            }
        });

        // Ganti password dari dashboard (modal sederhana)
        changePasswordBtn.addEventListener("click", async () => {
            const newPass = prompt("Masukkan password baru (minimal 4 karakter):");
            if (!newPass || newPass.length < 4) {
                showMessage("Password minimal 4 karakter");
                return;
            }
            const confirm = prompt("Konfirmasi password baru:");
            if (newPass !== confirm) {
                showMessage("Konfirmasi tidak cocok");
                return;
            }
            const token = await auth.currentUser?.getIdToken();
            if (!token) return;
            try {
                await setPassword(token, newPass);
                showMessage("Password berhasil diubah!", false);
            } catch (err) {
                showMessage(err.message);
            }
        });

        resetHwidBtn.addEventListener("click", async () => {
            if (!confirm("Reset HWID akan mengizinkan login dari PC lain. Lanjutkan?")) return;
            const token = await auth.currentUser?.getIdToken();
            if (!token) return;
            try {
                await resetHwid(token);
            } catch (err) {
                showMessage(err.message);
            }
        });

        logoutBtn.addEventListener("click", async () => {
            await signOut(auth);
        });

        // Auth state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const token = await user.getIdToken();
                try {
                    await loadProfile(token);
                } catch (err) {
                    showMessage(err.message);
                    // Jika error "User tidak ditemukan" dll, tetap login? Kita tetap tampilkan set password?
                    if (err.message.includes("tidak ditemukan") || err.message.includes("password belum diset")) {
                        setPasswordSection.classList.remove("hidden");
                        dashboardSection.classList.add("hidden");
                        loginSection.classList.add("hidden");
                        userEmailSpan.textContent = user.email;
                    } else {
                        // error lain, logout
                        await signOut(auth);
                    }
                }
            } else {
                loginSection.classList.remove("hidden");
                setPasswordSection.classList.add("hidden");
                dashboardSection.classList.add("hidden");
            }
        });

        document.getElementById("google-login-btn").addEventListener("click", async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                showMessage("Login gagal: " + err.message);
            }
        });
    </script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Login Section -->
        <div id="login-section" class="bg-white rounded-lg shadow-md p-8 text-center">
            <h1 class="text-2xl font-bold mb-4">🔐 AHK Account Manager</h1>
            <p class="mb-4">Login dengan Google untuk mengelola password AHK dan HWID</p>
            <button id="google-login-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">
                Login dengan Google
            </button>
            <div id="message" class="mt-4"></div>
        </div>

        <!-- Set Password Section (first time) -->
        <div id="set-password-section" class="hidden bg-white rounded-lg shadow-md p-8">
            <h2 class="text-xl font-bold mb-4">Buat Password untuk AHK</h2>
            <p class="mb-2">Email: <span id="user-email" class="font-mono"></span></p>
            <div class="mb-4">
                <label class="block text-gray-700">Password AHK (min 4 karakter)</label>
                <input type="password" id="new-password" class="w-full border rounded px-3 py-2 mt-1">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Konfirmasi Password</label>
                <input type="password" id="confirm-password" class="w-full border rounded px-3 py-2 mt-1">
            </div>
            <button id="save-password-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded w-full">
                Simpan Password
            </button>
            <div class="mt-4 text-center">
                <button id="logout-btn" class="text-red-600 text-sm">Logout</button>
            </div>
        </div>

        <!-- Dashboard Section (sudah punya password) -->
        <div id="dashboard-section" class="hidden bg-white rounded-lg shadow-md p-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">📊 Dashboard AHK</h2>
                <button id="logout-btn-dash" class="text-red-600 text-sm">Logout</button>
            </div>
            <div class="border-b pb-2 mb-2">
				<p class="text-gray-500 text-sm">Username (untuk login AHK)</p>
				<p id="display-username" class="font-medium">-</p>
			</div>
            <div class="border-b pb-2 mb-4">
                <p class="text-gray-500 text-sm">HWID Aktif</p>
                <p id="hwid" class="font-mono">-</p>
            </div>
            <div class="flex gap-4">
                <button id="change-password-btn" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded flex-1">
                    Ganti Password
                </button>
                <button id="reset-hwid-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white py-2 px-4 rounded flex-1">
                    Reset HWID
                </button>
            </div>
            <p class="text-xs text-gray-400 mt-4 text-center">Reset HWID = izinkan login dari PC lain (HWID lama dihapus)</p>
        </div>
    </div>
    <script>
        // karena ada logout button di dashboard juga, perlu sinkron
        const logoutBtnDash = document.getElementById("logout-btn-dash");
        if (logoutBtnDash) {
            logoutBtnDash.addEventListener("click", async () => {
                const { signOut } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
                const auth = getAuth();
                signOut(auth);
            });
        }
    </script>
</body>
</html>
